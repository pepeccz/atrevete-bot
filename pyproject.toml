[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
  | migrations
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "migrations",
]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    # The rules below are intentionally relaxed for this codebase:
    "B904",  # raise ... from err — bulk legacy across api/routes/admin.py; tracked, will fix gradually
    "B007",  # unused loop control variable — common idiom (for _, v in items())
    "E712",  # == True/False — SQLAlchemy ORM columns require literal comparison
    "UP042", # class X(str, Enum) — serialization pattern; StrEnum migration not adopted yet
    "C401",  # unnecessary generator — pure style preference
    "C408",  # unnecessary dict() call — pure style preference
    "C416",  # unnecessary comprehension — pure style preference
]

[tool.ruff.lint.per-file-ignores]
# QA investigation scripts are throwaway by nature — unused vars and import-order
# warnings would just create churn. Whitespace tolerance for the same reason.
"tests/e2e/qa_*.py" = ["F841", "E402", "W291", "W293", "E741", "B007"]
"tests/e2e/run_qa_*.py" = ["F841", "E402", "W291", "W293", "E741"]
"tests/e2e/harness/run_qa_*.py" = ["F841", "E402", "W291", "W293", "E741"]
"tests/qa_*.py" = ["F841", "E402", "W291", "W293", "E741", "F811"]
"tests/qa_run_*.py" = ["F841", "E402", "W291", "W293", "E741"]
# Alembic migration files: trailing whitespace in long SQL string literals is acceptable.
"database/alembic/versions/*.py" = ["W291", "W293", "E501", "B007", "F841"]
# Maintenance scripts often pre-declare variables for debug visibility.
"database/scripts/*.py" = ["F841"]
"scripts/*.py" = ["F841", "B007"]
# Test fixtures sometimes pre-allocate variables for clarity or future use.
"tests/**/*.py" = ["F841", "E741", "E402", "B017"]

[tool.mypy]
python_version = "3.11"
# Pragmatic, non-strict configuration. The codebase accumulated 1000+ unannotated
# functions and Optional-vs-str mismatches during a long pre-CI period; flipping
# every strict flag on at once would block CI indefinitely. We keep mypy installed
# and running, but only as a smoke-test for catastrophic regressions until the
# codebase is annotated per module.
ignore_missing_imports = true
warn_no_return = true
# Legacy escape hatch: don't treat None as incompatible with non-Optional types.
# Removes ~50 arg-type / union-attr errors in code paths that handle None at
# runtime via guards but don't annotate it. Re-enable per-module as we tighten.
strict_optional = false
# Disable noisy error codes that pollute the legacy code paths. Most of these
# represent runtime-correct code that just lacks tight types. Re-enable as
# specific packages are annotated.
disable_error_code = [
    "arg-type",
    "union-attr",
    "attr-defined",
    "assignment",
    "operator",
    "prop-decorator",
    "truthy-bool",
    "typeddict-item",   # AgentState TypedDict has many partial-update patterns
    "dict-item",        # similar — dicts built incrementally
    "var-annotated",    # legacy unannotated locals
    "misc",
    "call-arg",
    "valid-type",
    "override",
    "no-untyped-def",
    "literal-required",
]
# All other strict flags intentionally OFF. Re-enable per module as packages
# are properly annotated (see the agent.tracing override below for an example).

# Modules that ARE fully annotated get the stricter rules.
[[tool.mypy.overrides]]
module = ["agent.tracing.*", "agent.middleware.llm_trace"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true

# SQL-heavy, maintenance, and one-off scripts: typing adds no value here.
[[tool.mypy.overrides]]
module = [
    "tests.*",
    "scripts.*",
    "spikes.*",
    "database.seeds.*",
    "database.alembic.*",
    "database.scripts.*",
]
ignore_errors = true

[tool.pytest.ini_options]
minversion = "8.3"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=agent",
    "--cov=shared",
    "--cov=database",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=html",
    "--cov-report=xml",
    "--cov-fail-under=60",
    "-vv",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    "ignore::UserWarning",
]
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end scenario tests",
    "slow: Slow running tests",
    "llm: Tests that require live OpenRouter LLM credentials (skip in CI without creds)",
]

[tool.coverage.run]
source = ["."]
omit = [
    "*/tests/*",
    "*/migrations/*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/.venv/*",
    "*/env/*",
    "setup.py",
    # agent/* removed - core agent logic must be tested for Epic 2+
    "admin/*",  # Admin panel deferred to Epic 7
]

[tool.coverage.report]
precision = 2
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]
