      la zona del busto (60 min) \u2014 id=e5ab3a0f-72c6-a6b7-8864-6a06970e3436\n
      [PRINCIPAL \u00b7 wax \u00b7 any] cera enteras \u2014 40min \u2014 Depilaci\u00f3n
