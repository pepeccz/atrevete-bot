      est\u00e1ndar de u\u00f1as de manos. Sin tratamiento adicional (30 min) \u2014
      id=cc30a1c4-b1c7-56f4-2f19-14a88a6f09b1\n [PRINCIPAL \u00b7 pedicure \u00b7
      any] limar y pintar pies \u2014 30min \u2014 Limado + esmaltado est\u00e1ndar
