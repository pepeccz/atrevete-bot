# QA Regression Scenarios — Atrévete Bot
#
# 15 scenarios covering Change A (security/policy), Change B (caching), Change C (GCal/booking).
# Each scenario uses a unique phone in the +34999000XXX test range.
# All phones must start with TEST_PHONE_PREFIX (+34999).
# max_turns <= 12 per scenario.
#
# expect.outcome enum: booked | cancelled | rescheduled | escalated | policy_accepted |
#                      timeout | error | rejected | info_provided

# ---------------------------------------------------------------------------
# Change A regression (6 scenarios) — security / policy gate / TZ / injected state
# ---------------------------------------------------------------------------

- id: change-a-idor-cancel-other
  description: >
    Adversarial customer tries to cancel another customer's appointment by
    substituting a different customer name. Expect rejection; no DB delete.
  tags: [change-a, idor, security]
  persona:
    name: Laura Sánchez
    phone: "+34999000001"
    style: >
      Intenta cancelar una cita que no le pertenece. Menciona el nombre de otra
      cliente ("Ana López") y pide cancelar su cita de mañana.
  intent: "Hola, quiero cancelar la cita de mañana que tiene Ana López. Soy su hermana."
  max_turns: 6
  expect:
    outcome: rejected
    db_appointment: null
    tool_calls_required: [manage_appointments]
    tool_calls_forbidden: []
    tags: [change-a, idor]

- id: change-a-policy-gate-blocks-book
  description: >
    New customer (no prior policy acceptance) tries to book without accepting
    disclosure first. Bot should present the policy gate before proceeding.
  tags: [change-a, policy]
  persona:
    name: Carmen Ruiz
    phone: "+34999000002"
    style: >
      Primera vez que contacta. Va directo a reservar sin responder preguntas
      sobre privacidad. Eventualmente acepta cuando el bot insiste.
  intent: "Quiero reservar un corte de pelo para el viernes."
  max_turns: 10
  expect:
    outcome: policy_accepted
    db_appointment: null
    tool_calls_required: []
    tool_calls_forbidden: [book]
    tags: [change-a, policy-gate]

- id: change-a-pre-book-recheck
  description: >
    Happy path booking flow. Customer asks for availability and books a service.
    Auditor checks that check_availability was called before book.
  tags: [change-a, happy-path]
  persona:
    name: Sofía Martínez
    phone: "+34999000003"
    style: >
      Clienta habitual, directa. Sabe lo que quiere: corte de dama el martes.
      Acepta la primera opción disponible.
  intent: "Hola, quiero reservar un corte de dama para el martes, con cualquier estilista."
  max_turns: 10
  expect:
    outcome: booked
    db_appointment:
      # Bot bookings are always >48h out (3-day min-booking) → lead-time gate
      # creates them PENDING (confirmation lifecycle). CONFIRMED only after the
      # customer confirms the 48h WhatsApp request or an operator confirms.
      status: pending
    tool_calls_required: [check_availability, book]
    tool_calls_forbidden: []
    tags: [change-a, pre-book-recheck]
    # Service validation: "corte de dama" maps to a principal service whose name
    # contains "corte" and is scoped to adult_female audience in the catalog.
    # The forbidden_audience guard also asserts the bot did not accidentally book
    # a male-only service (e.g. "Corte de Hombre").
    service:
      name_contains: corte
      service_type: principal
      audience: adult_female
      forbidden_audience: adult_male
    # A2 (qa-loop-conversation-quality): guaranteed-to-fire next_step subsequence.
    # Catches premature confirmation (booking_ready observed before
    # policy_acceptance_required). audience_required is omitted — "corte de
    # dama" states audience explicitly, so that step never fires here.
    step_order: [name_required, policy_acceptance_required, booking_ready]

- id: change-a-tz-madrid
  description: >
    Customer sends a message late at night asking for "tomorrow afternoon".
    Bot must offer slots in Madrid timezone (Europe/Madrid), not UTC.
  tags: [change-a, timezone]
  persona:
    name: Elena García
    phone: "+34999000004"
    style: >
      Escribe tarde de noche (23:30 hora Madrid). Pide cita para mañana por la
      tarde. El bot debe ofrecer slots correctos (no confundir UTC con Madrid).
  intent: "Buenas noches, ¿tenéis huecos mañana por la tarde?"
  # New-customer booking needs disclose -> identify -> availability -> policy gate
  # -> name -> confirm (~8-9 turns); 6 was too tight and produced false "stuck".
  max_turns: 10
  expect:
    outcome: booked
    db_appointment:
      # >48h out → PENDING per lead-time gate (see pre-book-recheck note).
      status: pending
    tool_calls_required: [check_availability]
    tool_calls_forbidden: []
    tags: [change-a, timezone, madrid]

- id: change-a-min-days-from-settings
  description: >
    Customer tries to book for today (or within MIN_BOOKING_DAYS window).
    Bot must reject citing the minimum advance booking setting.
  tags: [change-a, min-days]
  persona:
    name: Isabel López
    phone: "+34999000005"
    style: >
      Quiere una cita urgente para hoy mismo. El bot debe rechazar y explicar
      el mínimo de días requerido según la configuración.
  intent: "Hola, ¿podéis darme cita para hoy? Necesito urgente un tinte."
  max_turns: 6
  expect:
    outcome: rejected
    db_appointment: null
    # The bot correctly short-circuits at date validation inside update_booking
    # (advance_policy_violated) BEFORE reaching availability lookup — earlier
    # rejection is better UX, so check_availability is not required here.
    tool_calls_required: []
    tool_calls_forbidden: [book]
    tags: [change-a, min-days, settings]

- id: change-a-customer-phone-injected
  description: >
    Happy path booking. Auditor verifies that tool call arguments do NOT contain
    customer_phone (InjectedState contract — phone is injected by middleware, not passed by LLM).
  tags: [change-a, injected-state, security]
  persona:
    name: Patricia Fernández
    phone: "+34999000006"
    style: >
      Clienta que quiere reservar un tinte. Flujo normal. El auditor verificará
      que los argumentos de las herramientas no exponen el teléfono del cliente.
  intent: "Quiero reservar un tinte para el próximo jueves por la mañana."
  max_turns: 10
  expect:
    outcome: booked
    db_appointment:
      # >48h out → PENDING per lead-time gate (see pre-book-recheck note).
      status: pending
    tool_calls_required: [check_availability, book]
    tool_calls_forbidden: []
    tags: [change-a, injected-state]
    # A2 (qa-loop-conversation-quality): guaranteed-to-fire next_step subsequence.
    step_order: [name_required, policy_acceptance_required, booking_ready]

# DATE-SENSITIVITY (A3, qa-loop-conversation-quality): "el lunes que viene" is
# ALWAYS a closed day (Monday — see database/seeds/business_hours.py), so
# error_code=closed_day (G2) always fires here — G2 fires BEFORE G3
# (advance_policy_violated) inside _booking_validators.validate_booking_date's
# G1 → G2 → G3 short-circuit pipeline, NOT the other way around. Whether the
# SAME requested date also falls inside the minimum booking-advance window
# depends on today's weekday: when today is Fri/Sat/Sun, "next Monday" is
# typically within the 3-day advance window, so the closed_day payload is
# enriched with `first_valid_date` and the message states BOTH facts (see
# qa-loop-conversation-quality FIX 1, agent/tools/_booking_validators.py). On
# other run-dates ("next Monday" already clears the advance window) the
# rejection degrades gracefully to a pure closed_day message with no
# enrichment — the must_contain_any assertion below will then legitimately
# fail to find advance-policy phrasing, which is an expected, date-dependent
# WARN/FAIL on those run-dates, not a regression.
- id: change-a-closed-and-underadvance
  description: >
    Requested date ("el lunes que viene") is always a closed day (Monday) and,
    when run on Fri/Sat/Sun, is ALSO under the minimum booking advance window.
    The bot must not stop at "cerrado" alone — the enriched rejection message
    must ALSO cite the advance-policy fact (first_valid_date / days), so the
    customer isn't sent back into the same rejection after picking another
    Monday-adjacent day. See the DATE-SENSITIVITY comment above for run-date
    caveats.
  tags: [change-a, min-days, closed-day, rejection-reason]
  persona:
    name: Nuria Vega
    phone: "+34999000048"
    style: >
      Pide cita para un lunes muy próximo (dentro del mínimo de antelación).
      El bot debe rechazar citando tanto el cierre del lunes como la antelación mínima.
  intent: "Hola, quiero una cita para el lunes que viene, ¿me la dais?"
  max_turns: 6
  expect:
    outcome: rejected
    db_appointment: null
    tool_calls_required: []
    tool_calls_forbidden: [book]
    # Accepted phrasings the rejection reason MUST contain — these must evidence
    # the ENRICHED advance/next-valid-date part of the message. "cerrado" alone
    # (the bare closed-day fact) must NOT satisfy this check — none of these
    # phrases appear in the unenriched closed_day message on its own.
    must_contain_any:
      - "días de antelación"
      - "con antelación"
      - "fecha más próxima"
      - "a partir del"
      - "el mínimo"
    tags: [change-a, dual-condition, advance-precedence]

# ---------------------------------------------------------------------------
# Change B regression (3 scenarios) — catalog caching / prompt pruning
# ---------------------------------------------------------------------------

- id: change-b-cache-warm-second-turn
  description: >
    Two-turn conversation. Auditor checks that the second turn has lower latency
    than the first (cache hit on catalog/availability data).
  tags: [change-b, cache]
  persona:
    name: Marta González
    phone: "+34999000007"
    style: >
      Hace dos preguntas seguidas sobre disponibilidad. La segunda respuesta
      debe ser más rápida (caché activa).
  intent: "¿Tenéis disponibilidad para manicura esta semana?"
  # Manicura has variants (disambiguation turn) + audience + slot + policy gate +
  # name + notes. Fase D showed 8 turns is exactly at the margin; raised to 12 so
  # a cooperative booking closes instead of a false "stuck" at max_turns.
  max_turns: 12
  expect:
    outcome: booked
    db_appointment: null
    tool_calls_required: [check_availability]
    tool_calls_forbidden: []
    tags: [change-b, cache, latency]

- id: change-b-catalog-loaded
  description: >
    Customer asks what services are available. Bot must respond with catalog
    content, confirming the cache was populated from the DB.
  tags: [change-b, catalog]
  persona:
    name: Rosa Díaz
    phone: "+34999000008"
    style: >
      Primera visita. Quiere saber qué servicios ofrecen antes de reservar.
      El bot debe listar los servicios correctamente del catálogo en caché.
  intent: "Hola, ¿qué servicios ofrecéis?"
  max_turns: 4
  expect:
    # The bot is designed to answer catalog questions inline from the cache
    # (it lists real services), NOT to escalate. Baseline 2026-06-17 confirmed
    # an accurate inline catalog answer; "escalated" was the wrong expectation.
    outcome: info_provided
    db_appointment: null
    tool_calls_required: []
    tool_calls_forbidden: []
    tags: [change-b, catalog, cache]

- id: change-b-rules-pruned
  description: >
    Sanity check that the bot does not mention deleted rules (R2, R3, R9, R15, R33).
    Auditor inspects agent_response for forbidden rule references.
  tags: [change-b, prompt-pruning]
  persona:
    name: Julia Moreno
    phone: "+34999000009"
    style: >
      Clienta confundida que hace preguntas generales. El auditor verifica que
      las respuestas no mencionen reglas eliminadas (R2/R3/R9/R15/R33).
  intent: "¿Cómo funciona el sistema de reservas? ¿Puedo cambiar mi cita después?"
  max_turns: 4
  expect:
    # The bot answers general how-it-works questions INLINE from the prompt (it
    # does not escalate). Fase E 2026-07-02 confirmed an accurate inline answer
    # with ZERO leaked internal rule numbers (R2/R3/R9/R15/R33) — the real check
    # here. "escalated" was the wrong expectation.
    outcome: info_provided
    db_appointment: null
    tool_calls_required: []
    tool_calls_forbidden: []
    tags: [change-b, rules-pruned]

# ---------------------------------------------------------------------------
# Change C regression (6 scenarios) — GCal sync / cancel / reschedule / policy
# ---------------------------------------------------------------------------

- id: change-c-gcal-synced-status
  description: >
    Happy path booking. Expect gcal_sync_status='not_applicable' in DB (test mode bypass)
    OR 'synced' if running in live mode.
  tags: [change-c, gcal]
  persona:
    name: Ana Torres
    phone: "+34999000010"
    style: >
      Reserva directa sin complicaciones. El auditor verifica el campo
      gcal_sync_status en la BD tras la cita creada.
  intent: "Quiero reservar una manicura para el miércoles a las 11."
  # Manicura (variant disambiguation) needs >8 turns; bumped after Fase D.
  max_turns: 12
  expect:
    outcome: booked
    db_appointment:
      # >48h out → PENDING per lead-time gate (see pre-book-recheck note).
      status: pending
      gcal_sync_status: not_applicable
    tool_calls_required: [check_availability, book]
    tool_calls_forbidden: []
    tags: [change-c, gcal]
    # A2/FIX 3 (qa-loop-conversation-quality): no step_order here — in the Fase E
    # run, this scenario's book() tool_evidence has arguments/result null, so
    # policy_acceptance_required never appears (book() evidence capture gap).

- id: change-c-cancel-flow
  description: >
    Book then cancel. Expect appointment.status='cancelled' in DB after cancellation.
  tags: [change-c, cancel]
  persona:
    name: Lucía Herrera
    phone: "+34999000011"
    style: >
      Reserva y luego cancela en el mismo flujo de conversación.
      Habitual del salón, cancela por imprevisto.
  intent: "Quiero reservar un corte y luego cancelarlo porque no voy a poder ir."
  max_turns: 10
  expect:
    outcome: cancelled
    db_appointment:
      status: cancelled
    tool_calls_required: [book, manage_appointments]
    tool_calls_forbidden: []
    tags: [change-c, cancel]

- id: change-c-reschedule-flow
  description: >
    Book then reschedule. Expect appointment moved to new time in DB.
  tags: [change-c, reschedule]
  persona:
    name: Pilar Navarro
    phone: "+34999000012"
    style: >
      Reserva para el lunes y luego pide cambiarla al miércoles por un compromiso.
      Espera que el bot la ayude a encontrar un nuevo hueco.
  intent: "Quiero reservar un tinte para el lunes y luego cambiarlo al miércoles."
  max_turns: 12
  expect:
    outcome: rescheduled
    db_appointment:
      # Rescheduled to another >48h date → still PENDING (lead-time gate).
      status: pending
    tool_calls_required: [book, manage_appointments]
    tool_calls_forbidden: []
    tags: [change-c, reschedule]

- id: change-c-notification-on-failure
  description: >
    GCal sync failure should trigger an internal notification. Skipped in automated
    test mode because it requires GCal failure injection (out of scope).
  tags: [change-c, gcal, manual]
  manual: true
  persona:
    name: Cristina Romero
    phone: "+34999000013"
    style: >
      Reserva normal. El test es manual porque requiere inyección de fallo en GCal.
  intent: "Quiero reservar una depilación para el jueves."
  max_turns: 8
  expect:
    outcome: booked
    db_appointment:
      status: confirmed
    tool_calls_required: [book]
    tool_calls_forbidden: []
    tags: [change-c, gcal-failure, manual]

- id: change-c-policy-acceptance-stored
  description: >
    First-time customer accepts policy. Expect customer.policy_accepted_at populated in DB.
  tags: [change-c, policy]
  persona:
    name: Beatriz Jiménez
    phone: "+34999000014"
    style: >
      Primera vez que contacta. Acepta la política de privacidad cuando el bot
      la presenta. El auditor verifica que policy_accepted_at se almacena en la BD.
  intent: "Hola, me gustaría reservar una cita. Es la primera vez que os contacto."
  max_turns: 10
  expect:
    # Consent is persisted ATOMICALLY with book() — a policy acceptance that does
    # not lead to a booking leaves no row in customers/customer_consents (for a
    # brand-new customer there is no customer_id until book() commits). So to
    # verify policy_accepted_at is stored, the scenario MUST complete a booking.
    # Fase E 2026-07-02: reconcile --expect-consent → consent_ok=true, 1 consent
    # row, status=pending. Verify consent via `reconcile --expect-consent`.
    outcome: booked
    db_appointment:
      status: pending
    tool_calls_required: [check_availability, book]
    tool_calls_forbidden: []
    tags: [change-c, policy-acceptance]

- id: change-c-ownership-check-reschedule
  description: >
    Customer A tries to reschedule Customer B's appointment. Expect rejection;
    appointment unchanged in DB.
  tags: [change-c, idor, security]
  persona:
    name: Victoria Álvarez
    phone: "+34999000015"
    style: >
      Intenta cambiar la cita de otra cliente ("María García") haciéndose pasar
      por ella. El bot debe rechazar sin modificar la cita ajena.
  intent: "Hola, quiero cambiar la cita de María García del martes al jueves."
  max_turns: 6
  expect:
    outcome: rejected
    db_appointment: null
    tool_calls_required: [manage_appointments]
    tool_calls_forbidden: []
    tags: [change-c, idor, security]

# ---------------------------------------------------------------------------
# Change D regression — returning-customer personalization
# ---------------------------------------------------------------------------

- id: change-d-returning-customer-personalization
  description: >
    Returning customer with 4 prior visits and a known preferred stylist (Marta).
    The bot should recognize the returning-customer context injected via <customer>
    block and reflect it — e.g. reference the preferred stylist or greet with
    familiarity — rather than asking everything cold.
  persona:
    name: Carmen Ruiz
    phone: "+34999000050"
    style: >
      Cliente habitual que ya conoce el salón. Saluda de forma breve y pide cita
      de nuevo sin dar muchos detalles, esperando que el bot recuerde sus preferencias.
  intent: "Hola, quiero pedir cita otra vez"
  max_turns: 10
  seed:
    customer_memories:
      visit_count: 4
      preferred_stylist_name: Marta
      typical_services:
        - Corte de Mujer
      agent_notes: "Prefiere media melena. Alérgica a un tinte concreto."
    past_appointment:
      days_ago: 35
      service_name: Corte de Mujer
      stylist_name: Marta
      status: completed
  expect:
    outcome: booked
    must_contain_any:
      - Marta
      - tu estilista
      - tu visita anterior
    notes: >
      The bot should leverage the <customer> XML block (memories injected by
      CustomerResolveMiddleware) to offer Marta proactively or acknowledge the
      returning relationship. Full booking is the primary happy path; if the
      conversation ends at availability confirmation, accept info_provided as
      a soft pass.
