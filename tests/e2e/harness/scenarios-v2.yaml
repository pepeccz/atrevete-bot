      Primera vez. Manda un emoji solo (💇‍♀️) como intento de pedir cita.
      Espera que el bot le pregunte qué quiere.
  intent: "💇‍♀️"
  max_turns: 5
  expect:
    outcome: stuck
    db_appointment: null
    tool_calls_required: []
    tool_calls_forbidden: []
    tags: [media, emoji, ambiguous-input]

# ===========================================================================
# Change H — Reschedule / Cancel expansion scenarios (phones 041..044)
#
# These 4 scenarios extend coverage of manage_appointments flows. Added by
# Change H (qa-harness-improvements) after the original 15+25 battery was
# found to have insufficient reschedule/cancel signal.
#
# Phones: +34999000041..+34999000044 (exclusive to this block; not in v1 or
